# Log4j 1.x configuration.
# Log4j 1.x reached end of life in 2015 and is retained intentionally so that
# modernization tooling can detect it (see com.example.inventory.util.LoggingUtil).

log4j.rootLogger=INFO, CONSOLE

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%d{ISO8601} [%t] %-5p %c{1} - %m%n

log4j.logger.com.example.inventory=DEBUG
